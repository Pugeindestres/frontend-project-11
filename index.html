<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Агрегатор</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">RSS агрегатор</h1>
    <p class="text-center mb-4">Начните читать RSS сегодня! Это легко, это красиво.</p>
    
    <div class="row">
      <div class="col-md-6 mx-auto">
        <!-- Форма добавления RSS -->
        <div id="rssFormContainer"></div>
        <div class="mt-3 text-muted small">
          Пример: <a href="https://lorem-rss.hexlet.app/feed" target="_blank">https://lorem-rss.hexlet.app/feed</a>
        </div>
      </div>
    </div>

    <div class="row mt-5">
      <div class="col-md-4">
        <!-- Контейнер для фидов с классом .feeds -->
        <div class="feeds" id="feedsContainer">
          <div class="card">
            <div class="card-body">
              <h3>Фиды</h3>
              <p class="text-muted">Нет добавленных RSS</p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <!-- Контейнер для постов с классом .posts -->
        <div class="posts" id="postsContainer">
          <div class="card">
            <div class="card-body">
              <h3>Посты</h3>
              <p class="text-muted">Нет постов</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно -->
  <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
          <a href="#" class="btn btn-primary full-article-link" target="_blank">Читать полностью</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/index.js"></script>
</body>
</html>
