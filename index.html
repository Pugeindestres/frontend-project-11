<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Агрегатор</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">RSS Агрегатор</h1>
    
    <div class="row">
      <div class="col-md-6 mx-auto">
        <div id="rssFormContainer"></div>
      </div>
    </div>

    <div class="row mt-5">
      <div class="col-md-4">
        <div id="feedsContainer"></div>
      </div>
      <div class="col-md-8">
        <div id="postsContainer"></div>
      </div>
    </div>
  </div>

  <!-- ВАЖНО: id="modal" (не postModal) -->
  <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
          <a href="#" class="btn btn-primary full-article-link" target="_blank">Читать полностью</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/index.js"></script>
</body>
</html>
